<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        .form-group {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover { background: #5a67d8; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background: #667eea; color: white; }
        .btn-danger { background: #dc3545; }
        .btn-back { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>📦 Product Management</h1>
            <button class="btn-back" onclick="goBack()">← Back to Dashboard</button>
        </div>
        
        <div class="form-group">
            <h3>Add New Product</h3>
            <input type="text" id="productName" placeholder="Product Name">
            <input type="number" id="productPrice" placeholder="Price" step="0.01">
            <input type="number" id="productStock" placeholder="Stock">
            <button onclick="addProduct()">Add Product</button>
        </div>
        
        <div id="productsTable"></div>
    </div>
    
    <script>
        async function checkAuth() {
            const response = await fetch('/api/check-auth');
            const data = await response.json();
            if (!data.authenticated || data.role !== 'admin') {
                window.location.href = '/';
            }
            loadProducts();
        }
        
        async function loadProducts() {
            const response = await fetch('/api/products');
            const products = await response.json();
            
            document.getElementById('productsTable').innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Sales</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${p.id}</td>
                                <td><input type="text" id="name_${p.id}" value="${p.name}"></td>
                                <td><input type="number" id="price_${p.id}" value="${p.price}" step="0.01"></td>
                                <td><input type="number" id="stock_${p.id}" value="${p.stock}"></td>
                                <td>${p.sales || 0}</td>
                                <td>
                                    <button onclick="updateProduct(${p.id})">Update</button>
                                    <button class="btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        async function addProduct() {
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            
            const response = await fetch('/api/products', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, price, stock})
            });
            
            if (response.ok) {
                alert('Product added successfully');
                loadProducts();
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productStock').value = '';
            }
        }
        
        async function updateProduct(id) {
            const name = document.getElementById(`name_${id}`).value;
            const price = parseFloat(document.getElementById(`price_${id}`).value);
            const stock = parseInt(document.getElementById(`stock_${id}`).value);
            
            const response = await fetch(`/api/products/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, price, stock})
            });
            
            if (response.ok) {
                alert('Product updated successfully');
                loadProducts();
            }
        }
        
        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                const response = await fetch(`/api/products/${id}`, {method: 'DELETE'});
                if (response.ok) {
                    alert('Product deleted successfully');
                    loadProducts();
                }
            }
        }
        
        function goBack() {
            window.location.href = '/';
        }
        
        checkAuth();
    </script>
</body>
</html>
