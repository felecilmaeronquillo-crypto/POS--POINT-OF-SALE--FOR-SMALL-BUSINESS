<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="location.href='/'">← Back</button>
        <h1>Product Management</h1>
        <div><input id="name" placeholder="Name"><input id="price" placeholder="Price"><input id="stock" placeholder="Stock"><button onclick="addProduct()">Add</button></div>
        <div id="products"></div>
    </div>
    <script>
        async function loadProducts() {
            const res = await fetch('/api/products');
            const p = await res.json();
            document.getElementById('products').innerHTML = `
                <table><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
                ${p.map(prod => `
                    <tr>
                        <td>${prod.id}</td>
                        <td><input id="name_${prod.id}" value="${prod.name}"></td>
                        <td><input id="price_${prod.id}" value="${prod.price}"></td>
                        <td><input id="stock_${prod.id}" value="${prod.stock}"></td>
                        <td><button onclick="updateProduct(${prod.id})">Update</button><button class="btn-danger" onclick="deleteProduct(${prod.id})">Delete</button></td>
                    </tr>
                `).join('')}</table>
            `;
        }
        async function addProduct() {
            await fetch('/api/products', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: name.value, price: parseFloat(price.value), stock: parseInt(stock.value)})});
            loadProducts();
        }
        async function updateProduct(id) {
            await fetch(`/api/products/${id}`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: document.getElementById(`name_${id}`).value, price: parseFloat(document.getElementById(`price_${id}`).value), stock: parseInt(document.getElementById(`stock_${id}`).value)})});
            loadProducts();
        }
        async function deleteProduct(id) {
            if(confirm('Delete?')) await fetch(`/api/products/${id}`, {method: 'DELETE'});
            loadProducts();
        }
        loadProducts();
    </script>
</body>
</html>
