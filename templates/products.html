<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 20px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            text-decoration: none;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h3 { margin-bottom: 1rem; color: #333; }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f5f5f5;
        }
        .action-buttons button {
            margin-right: 0.5rem;
        }
        .message {
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-radius: 10px;
            text-align: center;
        }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🛍️ Product Management</h2>
            <a href="/" class="back-btn">← Back to Dashboard</a>
        </div>
        
        <div class="card">
            <h3>Add New Product</h3>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="productName" placeholder="Enter product name">
            </div>
            <div class="form-group">
                <label>Price (₱)</label>
                <input type="number" id="productPrice" placeholder="Enter price">
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" id="productStock" placeholder="Enter stock quantity">
            </div>
            <button class="btn btn-primary" onclick="addProduct()">Add Product</button>
            <div id="addMessage"></div>
        </div>
        
        <div class="card">
            <h3>Product List</h3>
            <div style="overflow-x: auto;">
                <table id="productsTable">
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Sales</th><th>Actions</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 20px; padding: 2rem; width: 400px;">
            <h3>Edit Product</h3>
            <input type="hidden" id="editProductId">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="editProductName">
            </div>
            <div class="form-group">
                <label>Price (₱)</label>
                <input type="number" id="editProductPrice">
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" id="editProductStock">
            </div>
            <button class="btn btn-primary" onclick="updateProduct()">Save Changes</button>
            <button class="btn btn-danger" onclick="closeEditModal()">Cancel</button>
        </div>
    </div>

    <script>
        async function loadProducts() {
            const response = await fetch('/api/products');
            const products = await response.json();
            
            const tbody = document.querySelector('#productsTable tbody');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>₱${p.price.toLocaleString()}</td>
                    <td>${p.stock}</td>
                    <td>${p.sales || 0}</td>
                    <td class="action-buttons">
                        <button class="btn btn-warning" onclick="openEditModal(${p.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        
        async function addProduct() {
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            
            if (!name || isNaN(price) || isNaN(stock)) {
                showMessage('addMessage', 'Please fill all fields', 'error');
                return;
            }
            
            const response = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, stock })
            });
            
            if (response.ok) {
                showMessage('addMessage', 'Product added successfully', 'success');
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productStock').value = '';
                loadProducts();
            } else {
                showMessage('addMessage', 'Failed to add product', 'error');
            }
        }
        
        let currentProductId = null;
        
        async function openEditModal(productId) {
            const response = await fetch('/api/products');
            const products = await response.json();
            const product = products.find(p => p.id === productId);
            
            if (product) {
                currentProductId = productId;
                document.getElementById('editProductId').value = productId;
                document.getElementById('editProductName').value = product.name;
                document.getElementById('editProductPrice').value = product.price;
                document.getElementById('editProductStock').value = product.stock;
                document.getElementById('editModal').style.display = 'flex';
            }
        }
        
        async function updateProduct() {
            const name = document.getElementById('editProductName').value;
            const price = parseFloat(document.getElementById('editProductPrice').value);
            const stock = parseInt(document.getElementById('editProductStock').value);
            
            const response = await fetch(`/api/products/${currentProductId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, stock })
            });
            
            if (response.ok) {
                closeEditModal();
                loadProducts();
            } else {
                alert('Failed to update product');
            }
        }
        
        async function deleteProduct(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadProducts();
                } else {
                    alert('Failed to delete product');
                }
            }
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentProductId = null;
        }
        
        function showMessage(elementId, message, type) {
            const msgDiv = document.getElementById(elementId);
            msgDiv.innerText = message;
            msgDiv.className = `message ${type}`;
            setTimeout(() => {
                msgDiv.innerText = '';
                msgDiv.className = 'message';
            }, 3000);
        }
        
        loadProducts();
    </script>
</body>
</html>
