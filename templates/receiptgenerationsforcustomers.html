<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generation - POS System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .receipt-preview {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .receipt-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #e0e0e0;
        }
        .receipt-content {
            font-family: monospace;
            white-space: pre-wrap;
            background: #fafafa;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .print-btn {
            background: #28a745;
            color: white;
        }
        .download-btn {
            background: #17a2b8;
            color: white;
        }
        .info-message {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="back-btn" onclick="window.location.href='/'">← Back to Dashboard</div>
        <div>Receipt Generation</div>
        <div></div>
    </div>
    
    <div class="container">
        <div class="receipt-preview">
            <div class="receipt-header">
                <h2>Receipt Preview</h2>
                <p>Latest transaction receipt</p>
            </div>
            <div id="receiptContent" class="receipt-content"></div>
            <div class="btn-group">
                <button class="print-btn" onclick="printReceipt()">🖨️ Print Receipt</button>
                <button class="download-btn" onclick="downloadReceipt()">💾 Download Receipt</button>
            </div>
        </div>
    </div>

    <script>
        let currentReceipt = null;
        
        async function loadLatestReceipt() {
            // Get the latest transaction
            const response = await fetch('/api/transactions');
            const transactions = await response.json();
            
            if (transactions && transactions.length > 0) {
                const latestTransaction = transactions[0];
                const receiptResponse = await fetch('/api/receipt/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transaction_id: latestTransaction.id })
                });
                
                if (receiptResponse.ok) {
                    const data = await receiptResponse.json();
                    currentReceipt = data.receipt;
                    document.getElementById('receiptContent').textContent = currentReceipt;
                } else {
                    document.getElementById('receiptContent').innerHTML = '<div class="info-message">No receipts available yet. Complete a transaction first.</div>';
                }
            } else {
                document.getElementById('receiptContent').innerHTML = '<div class="info-message">No receipts available yet. Complete a transaction first.</div>';
            }
        }
        
        function printReceipt() {
            if (currentReceipt) {
                const printWindow = window.open('', '_blank');
                printWindow.document.write('<html><head><title>Receipt</title></head><body><pre>' + currentReceipt + '</pre></body></html>');
                printWindow.document.close();
                printWindow.print();
            } else {
                alert('No receipt to print');
            }
        }
        
        function downloadReceipt() {
            if (currentReceipt) {
                const blob = new Blob([currentReceipt], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `receipt_${new Date().getTime()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert('No receipt to download');
            }
        }
        
        loadLatestReceipt();
        
        // Refresh receipt every 30 seconds
        setInterval(loadLatestReceipt, 30000);
    </script>
</body>
</html>
