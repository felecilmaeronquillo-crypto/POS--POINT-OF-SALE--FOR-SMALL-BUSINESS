<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generation - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 20px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            text-decoration: none;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .receipt-preview {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 1rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 1rem;
            margin-right: 0.5rem;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        select, input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        h3 { margin-bottom: 1rem; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🧾 Receipt Generation</h2>
            <a href="/" class="back-btn">← Back to Dashboard</a>
        </div>
        
        <div class="card">
            <h3>Select Transaction</h3>
            <select id="transactionSelect" title="Select Transaction" aria-label="Select Transaction" onchange="loadReceipt()">
                <option value="">-- Select a transaction --</option>
            </select>
            
            <div id="receiptPreview" class="receipt-preview">
                Select a transaction to view receipt
            </div>
            
            <button class="btn btn-primary" onclick="printReceipt()">🖨️ Print Receipt</button>
        </div>
    </div>

    <script>
        let currentReceipt = '';
        
        async function loadTransactions() {
            const response = await fetch('/api/transactions');
            const transactions = await response.json();
            
            const select = document.getElementById('transactionSelect');
            select.innerHTML = '<option value="">-- Select a transaction --</option>' + 
                transactions.map(t => `<option value="${t.id}">#${t.id} - ${new Date(t.date).toLocaleString()} - ₱${t.total.toLocaleString()}</option>`).join('');
        }
        
        async function loadReceipt() {
            const transactionId = document.getElementById('transactionSelect').value;
            if (!transactionId) {
                document.getElementById('receiptPreview').innerHTML = 'Select a transaction to view receipt';
                return;
            }
            
            const response = await fetch('/api/transactions');
            const transactions = await response.json();
            const transaction = transactions.find(t => t.id == transactionId);
            
            if (transaction) {
                // Generate receipt format
                const date = new Date(transaction.date);
                const receipt = [];
                receipt.push("╔════════════════════════════════════════╗");
                receipt.push("║           MODERN POS SYSTEM            ║");
                receipt.push("║        123 Business Street, City       ║");
                receipt.push("╚════════════════════════════════════════╝");
                receipt.push("");
                receipt.push(`Transaction #: ${transaction.id}`);
                receipt.push(`Date: ${date.toLocaleDateString()}`);
                receipt.push(`Time: ${date.toLocaleTimeString()}`);
                receipt.push(`Cashier: ${transaction.cashier || 'POS User'}`);
                receipt.push("─────────────────────────────────────────");
                receipt.push("");
                receipt.push("ITEMS:");
                
                for (const item of transaction.items) {
                    receipt.push(`${item.name}`);
                    receipt.push(`  ${item.quantity} x ₱${item.price.toLocaleString()} = ₱${(item.price * item.quantity).toLocaleString()}`);
                }
                
                receipt.push("");
                receipt.push("─────────────────────────────────────────");
                receipt.push(`Subtotal:                    ₱${transaction.subtotal.toLocaleString()}`);
                
                if (transaction.discount_amount > 0) {
                    receipt.push(`Discount:                     -₱${transaction.discount_amount.toLocaleString()}`);
                }
                
                receipt.push(`TOTAL:                       ₱${transaction.total.toLocaleString()}`);
                receipt.push(`Cash Payment:                ₱${transaction.payment.toLocaleString()}`);
                receipt.push(`Change:                      ₱${transaction.change.toLocaleString()}`);
                receipt.push("═════════════════════════════════════════");
                receipt.push("          THANK YOU FOR SHOPPING!");
                receipt.push("            Please come again!");
                receipt.push("═════════════════════════════════════════");
                
                currentReceipt = receipt.join("\n");
                document.getElementById('receiptPreview').innerText = currentReceipt;
            }
        }
        
        function printReceipt() {
            if (currentReceipt) {
                const printWindow = window.open('', '_blank');
                printWindow.document.write('<pre>' + currentReceipt + '</pre>');
                printWindow.document.close();
                printWindow.print();
            } else {
                alert('Please select a transaction first');
            }
        }
        
        loadTransactions();
    </script>
</body>
</html>
