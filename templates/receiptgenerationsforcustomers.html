<!DOCTYPE html>
<html>
<head>
    <title>Receipt Generation</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; }
        .receipt { background: #f8f9fa; padding: 20px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="location.href='/'">← Back</button>
        <h1>Receipt Generator</h1>
        <input type="number" id="transId" placeholder="Transaction ID">
        <button onclick="searchReceipt()">View Receipt</button>
        <div id="receipt" class="receipt"></div>
    </div>
    <script>
        async function searchReceipt() {
            const id = document.getElementById('transId').value;
            const res = await fetch(`/api/transactions/${id}`);
            if(res.status === 404) { alert('Not found'); return; }
            const t = await res.json();
            const date = new Date(t.date);
            let html = `╔════════════════════════════════╗<br>║      MODERN POS SYSTEM       ║<br>╚════════════════════════════════╝<br><br>`;
            html += `Transaction #: ${t.id}<br>Date: ${date.toLocaleString()}<br>Cashier: ${t.cashier}<br>────────────────────────<br><br>`;
            t.items.forEach(item => { html += `${item.name}<br>  ${item.quantity} x ₱${item.price} = ₱${item.price * item.quantity}<br>`; });
            html += `<br>────────────────────────<br>Subtotal: ₱${t.subtotal}<br>`;
            if(t.discount_amount > 0) html += `Discount: -₱${t.discount_amount}<br>`;
            html += `TOTAL: ₱${t.total}<br>Payment: ₱${t.payment}<br>Change: ₱${t.change}<br>════════════════════════════════`;
            document.getElementById('receipt').innerHTML = `<pre>${html}</pre>`;
        }
    </script>
</body>
</html>
