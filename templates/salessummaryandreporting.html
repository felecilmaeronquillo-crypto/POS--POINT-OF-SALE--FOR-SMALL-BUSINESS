<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            padding: 20px;
            border-radius: 10px;
            color: white;
        }
        .stat-card h3 { margin-bottom: 10px; }
        .stat-card .value { font-size: 32px; font-weight: bold; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        button {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>📊 Sales Reports & Analytics</h1>
            <button onclick="goBack()">← Back to Dashboard</button>
        </div>
        
        <div id="analytics"></div>
        
        <h3 style="margin-top: 30px;">Transaction History</h3>
        <div id="transactionsTable"></div>
    </div>
    
    <script>
        async function checkAuth() {
            const response = await fetch('/api/check-auth');
            const data = await response.json();
            if (!data.authenticated || data.role !== 'admin') {
                window.location.href = '/';
            }
            loadReports();
        }
        
        async function loadReports() {
            // Load analytics
            const analyticsResp = await fetch('/api/reports/analytics');
            const analytics = await analyticsResp.json();
            
            document.getElementById('analytics').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                        <h3>Total Revenue</h3>
                        <div class="value">₱${analytics.total_revenue.toFixed(2)}</div>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
                        <h3>Total Transactions</h3>
                        <div class="value">${analytics.total_transactions}</div>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
                        <h3>Total Items Sold</h3>
                        <div class="value">${analytics.total_items}</div>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                        <h3>Average Transaction</h3>
                        <div class="value">₱${analytics.avg_transaction.toFixed(2)}</div>
                    </div>
                </div>
                
                <h3>Best Selling Products</h3>
                <table>
                    <thead><tr><th>Product</th><th>Quantity Sold</th></tr></thead>
                    <tbody>
                        ${analytics.best_sellers.map(b => `<tr><td>${b.name}</td><td>${b.quantity}</td></tr>`).join('')}
                    </tbody>
                </table>
                
                <h3>Last 7 Days Trend</h3>
                <table>
                    <thead><tr><th>Date</th><th>Revenue</th><th>Transactions</th></tr></thead>
                    <tbody>
                        ${analytics.last_7_days.map(day => `
                            <tr>
                                <td>${day.date}</td>
                                <td>₱${day.revenue.toFixed(2)}</td>
                                <td>${day.transactions}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            // Load transactions
            const transactionsResp = await fetch('/api/transactions');
            const transactions = await transactionsResp.json();
            
            document.getElementById('transactionsTable').innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Date</th><th>Items</th><th>Total</th><th>Cashier</th></tr>
                    </thead>
                    <tbody>
                        ${transactions.map(t => `
                            <tr>
                                <td>${t.id}</td>
                                <td>${new Date(t.date).toLocaleString()}</td>
                                <td>${t.items.length} items</td>
                                <td>₱${t.total.toFixed(2)}</td>
                                <td>${t.cashier}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function goBack() {
            window.location.href = '/';
        }
        
        checkAuth();
    </script>
</body>
</html>
