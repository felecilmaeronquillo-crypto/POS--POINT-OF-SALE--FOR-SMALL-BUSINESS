<!DOCTYPE html>
<html>
<head>
    <title>Sales Reports</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="location.href='/'">← Back</button>
        <h1>Sales Reports</h1>
        <div id="analytics"></div>
        <h3>Transactions</h3>
        <div id="transactions"></div>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/reports/analytics');
            const a = await res.json();
            document.getElementById('analytics').innerHTML = `
                <div class="stats">
                    <div class="stat"><h3>Revenue</h3><div>₱${a.total_revenue}</div></div>
                    <div class="stat"><h3>Transactions</h3><div>${a.total_transactions}</div></div>
                    <div class="stat"><h3>Items Sold</h3><div>${a.total_items}</div></div>
                </div>
                <h3>Best Sellers</h3>
                <table>${a.best_sellers.map(b => `<tr><td>${b.name}</td><td>${b.quantity}</td></tr>`).join('')}</table>
            `;
            const res2 = await fetch('/api/transactions');
            const t = await res2.json();
            document.getElementById('transactions').innerHTML = `
                <table><tr><th>ID</th><th>Date</th><th>Total</th><th>Cashier</th></tr>
                ${t.map(tr => `<tr><td>${tr.id}</td><td>${new Date(tr.date).toLocaleString()}</td><td>₱${tr.total}</td><td>${tr.cashier}</td></tr>`).join('')}
                </table>
            `;
        }
        load();
    </script>
</body>
</html>
