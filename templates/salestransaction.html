<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Transaction - POS System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
            min-height: calc(100vh - 70px);
        }
        .products-panel {
            flex: 2;
            background: white;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }
        .cart-panel {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .search-bar input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        .product-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .product-price {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-stock {
            color: #666;
            font-size: 12px;
        }
        .low-stock {
            color: #ff6b6b;
        }
        .cart-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-name {
            font-weight: 500;
        }
        .cart-item-price {
            font-size: 12px;
            color: #666;
        }
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 25px;
            height: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 3px;
        }
        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .cart-summary {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .total-row {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        .discount-section {
            margin: 15px 0;
        }
        .discount-section select, 
        .discount-section input {
            padding: 8px;
            margin-top: 5px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .payment-section {
            margin: 15px 0;
        }
        .payment-section input {
            padding: 10px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .process-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            max-height: 80%;
            overflow-y: auto;
        }
        .receipt-text {
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="back-btn" onclick="window.location.href='/'">← Back to Dashboard</div>
        <div>Sales Transaction</div>
        <div></div>
    </div>
    
    <div class="container">
        <div class="products-panel">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
        
        <div class="cart-panel">
            <div class="cart-header">Shopping Cart</div>
            <div class="cart-items" id="cartItems"></div>
            
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span>₱<span id="subtotal">0</span></span>
                </div>
                
                <div class="discount-section">
                    <label>Discount Type:</label>
                    <select id="discountType">
                        <option value="none">None</option>
                        <option value="percentage">Percentage (%)</option>
                    </select>
                    <input type="number" id="discountValue" placeholder="Discount value" disabled>
                </div>
                
                <div class="summary-row">
                    <span>Discount:</span>
                    <span>-₱<span id="discountAmount">0</span></span>
                </div>
                
                <div class="summary-row total-row">
                    <span>Total:</span>
                    <span>₱<span id="total">0</span></span>
                </div>
                
                <div class="payment-section">
                    <input type="number" id="paymentAmount" placeholder="Enter payment amount">
                </div>
                
                <div class="summary-row">
                    <span>Change:</span>
                    <span>₱<span id="change">0</span></span>
                </div>
                
                <button class="process-btn" onclick="processPayment()">Process Payment</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="receiptModal">
        <div class="modal-content">
            <h3>Transaction Receipt</h3>
            <pre class="receipt-text" id="receiptText"></pre>
            <button onclick="closeReceipt()" style="margin-top: 15px; padding: 8px 16px;">Close</button>
            <button onclick="printReceipt()" style="margin-top: 15px; padding: 8px 16px; margin-left: 10px;">Print</button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = [];
        
        async function loadProducts() {
            const response = await fetch('/api/products');
            products = await response.json();
            displayProducts();
        }
        
        function displayProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm));
            
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = filtered.map(product => `
                <div class="product-card" onclick="addToCart(${product.id})">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">₱${product.price.toLocaleString()}</div>
                    <div class="product-stock ${product.stock < 10 ? 'low-stock' : ''}">
                        Stock: ${product.stock}
                    </div>
                </div>
            `).join('');
        }
        
        async function loadCart() {
            const response = await fetch('/api/cart');
            cart = await response.json();
            displayCart();
        }
        
        async function addToCart(productId) {
            const response = await fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            const data = await response.json();
            if (data.success) {
                await loadCart();
            } else {
                alert(data.message);
            }
        }
        
        async function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            const newQuantity = item.quantity + change;
            if (newQuantity < 1) {
                await removeItem(productId);
            } else {
                const response = await fetch(`/api/cart/update/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: newQuantity })
                });
                if (response.ok) {
                    await loadCart();
                }
            }
        }
        
        async function removeItem(productId) {
            await fetch(`/api/cart/remove/${productId}`, { method: 'DELETE' });
            await loadCart();
        }
        
        function displayCart() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">Cart is empty</p>';
                updateSummary();
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₱${item.price.toLocaleString()}</div>
                    </div>
                    <div class="cart-item-quantity">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button class="remove-btn" onclick="removeItem(${item.id})">×</button>
                    </div>
                </div>
            `).join('');
            
            updateSummary();
        }
        
        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('subtotal').textContent = subtotal.toLocaleString();
            
            const discountType = document.getElementById('discountType').value;
            const discountValue = parseFloat(document.getElementById('discountValue').value) || 0;
            
            let discountAmount = 0;
            if (discountType === 'percentage') {
                discountAmount = (subtotal * discountValue) / 100;
            }
            
            const total = subtotal - discountAmount;
            document.getElementById('discountAmount').textContent = discountAmount.toFixed(2);
            document.getElementById('total').textContent = total.toFixed(2);
            
            const payment = parseFloat(document.getElementById('paymentAmount').value) || 0;
            const change = payment - total;
            document.getElementById('change').textContent = change > 0 ? change.toFixed(2) : '0.00';
        }
        
        async function processPayment() {
            const payment = parseFloat(document.getElementById('paymentAmount').value);
            if (!payment || payment <= 0) {
                alert('Please enter payment amount');
                return;
            }
            
            const discountType = document.getElementById('discountType').value;
            const discountValue = parseFloat(document.getElementById('discountValue').value);
            
            const discount = discountType !== 'none' ? {
                type: discountType,
                value: discountValue
            } : null;
            
            const response = await fetch('/api/process-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payment, discount })
            });
            
            const data = await response.json();
            if (data.success) {
                document.getElementById('receiptText').textContent = data.receipt;
                document.getElementById('receiptModal').style.display = 'flex';
                await loadCart();
                await loadProducts();
                document.getElementById('paymentAmount').value = '';
                document.getElementById('discountValue').value = '';
                document.getElementById('discountType').value = 'none';
                document.getElementById('discountValue').disabled = true;
            } else {
                alert(data.message);
            }
        }
        
        function closeReceipt() {
            document.getElementById('receiptModal').style.display = 'none';
        }
        
        function printReceipt() {
            const receiptContent = document.getElementById('receiptText').textContent;
            const printWindow = window.open('', '_blank');
            printWindow.document.write('<pre>' + receiptContent + '</pre>');
            printWindow.document.close();
            printWindow.print();
        }
        
        document.getElementById('searchInput').addEventListener('input', displayProducts);
        document.getElementById('discountType').addEventListener('change', function() {
            document.getElementById('discountValue').disabled = this.value === 'none';
            updateSummary();
        });
        document.getElementById('discountValue').addEventListener('input', updateSummary);
        document.getElementById('paymentAmount').addEventListener('input', updateSummary);
        
        loadProducts();
        loadCart();
    </script>
</body>
</html>
