<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Transaction - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 20px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            text-decoration: none;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .products-panel, .cart-panel {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .product-name { font-weight: bold; font-size: 1.1rem; }
        .product-price { color: #667eea; font-weight: bold; margin: 0.5rem 0; }
        .product-stock { font-size: 0.8rem; color: #666; }
        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: bold; }
        .cart-item-price { font-size: 0.9rem; color: #666; }
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .cart-item-quantity input {
            width: 60px;
            padding: 0.25rem;
            text-align: center;
        }
        .cart-item-total { font-weight: bold; margin: 0 1rem; min-width: 80px; text-align: right; }
        .remove-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            cursor: pointer;
        }
        .cart-summary {
            border-top: 2px solid #ddd;
            padding-top: 1rem;
            margin-top: 1rem;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
        }
        .discount-section {
            margin: 1rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .payment-section {
            margin: 1rem 0;
        }
        .payment-section input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
        }
        .process-btn {
            width: 100%;
            padding: 1rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        .message {
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-radius: 10px;
            text-align: center;
        }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        h3 { margin-bottom: 1rem; color: #333; }
        .search-box {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🛒 Sales Transaction</h2>
            <a href="/" class="back-btn">← Back to Dashboard</a>
        </div>
        
        <div class="main-content">
            <div class="products-panel">
                <h3>Products</h3>
                <input type="text" id="searchInput" class="search-box" placeholder="Search products...">
                <div id="productsGrid" class="products-grid"></div>
            </div>
            
            <div class="cart-panel">
                <h3>Shopping Cart</h3>
                <div id="cartItems" class="cart-items"></div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <strong>Subtotal:</strong>
                        <span id="subtotal">₱0.00</span>
                    </div>
                    <div class="discount-section">
                        <label for="discountPercent">Discount (%):</label>
                        <input type="number" id="discountPercent" value="0" min="0" max="100" step="1" title="Discount percentage" placeholder="0">
                    </div>
                    <div class="summary-row">
                        <strong>Total:</strong>
                        <span id="total" style="font-size: 1.3rem; color: #667eea;">₱0.00</span>
                    </div>
                    <div class="payment-section">
                        <input type="number" id="paymentAmount" placeholder="Enter payment amount">
                    </div>
                    <button class="process-btn" onclick="processPayment()">Process Payment</button>
                    <div id="message"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Receipt Modal -->
    <div id="receiptModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 20px; padding: 2rem; max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <h3>Receipt</h3>
            <pre id="receiptContent" style="font-family: monospace; white-space: pre-wrap;"></pre>
            <button onclick="closeReceipt()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer;">Close</button>
            <button onclick="printReceipt()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 10px; cursor: pointer;">Print Receipt</button>
        </div>
    </div>

    <script>
        let products = [];
        
        async function loadProducts() {
            const response = await fetch('/api/products');
            products = await response.json();
            renderProducts();
        }
        
        function renderProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm));
            
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = filtered.map(product => `
                <div class="product-card" onclick="addToCart(${product.id})">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">₱${product.price.toLocaleString()}</div>
                    <div class="product-stock">Stock: ${product.stock}</div>
                </div>
            `).join('');
        }
        
        async function addToCart(productId) {
            const response = await fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            const data = await response.json();
            if (data.success) {
                showMessage(data.message, 'success');
                loadCart();
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        async function loadCart() {
            const response = await fetch('/api/cart');
            const cart = await response.json();
            renderCart(cart);
            updateTotals();
        }
        
        function renderCart(cart) {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">Cart is empty</p>';
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₱${item.price.toLocaleString()}</div>
                    </div>
                    <div class="cart-item-quantity">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                        <input type="number" value="${item.quantity}" min="0" onchange="updateQuantity(${item.id}, this.value)">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                    <div class="cart-item-total">₱${(item.price * item.quantity).toLocaleString()}</div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
                </div>
            `).join('');
        }
        
        async function updateQuantity(productId, quantity) {
            quantity = parseInt(quantity);
            if (isNaN(quantity) || quantity < 0) quantity = 0;
            
            const response = await fetch(`/api/cart/update/${productId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantity: quantity })
            });
            const data = await response.json();
            if (data.success) {
                loadCart();
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        async function removeFromCart(productId) {
            const response = await fetch(`/api/cart/remove/${productId}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (data.success) {
                loadCart();
            }
        }
        
        async function updateTotals() {
            const response = await fetch('/api/cart');
            const cart = await response.json();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discount = subtotal * discountPercent / 100;
            const total = subtotal - discount;
            
            document.getElementById('subtotal').innerText = `₱${subtotal.toLocaleString()}`;
            document.getElementById('total').innerText = `₱${total.toLocaleString()}`;
        }
        
        document.getElementById('discountPercent').addEventListener('input', updateTotals);
        document.getElementById('searchInput').addEventListener('input', renderProducts);
        
        async function processPayment() {
            const payment = parseFloat(document.getElementById('paymentAmount').value);
            if (isNaN(payment)) {
                showMessage('Please enter payment amount', 'error');
                return;
            }
            
            const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discountData = discountPercent > 0 ? { type: 'percentage', value: discountPercent } : null;
            
            const response = await fetch('/api/process-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payment: payment, discount: discountData })
            });
            const data = await response.json();
            
            if (data.success) {
                showMessage(data.message, 'success');
                document.getElementById('receiptContent').innerText = data.receipt;
                document.getElementById('receiptModal').style.display = 'flex';
                document.getElementById('paymentAmount').value = '';
                document.getElementById('discountPercent').value = '0';
                loadCart();
                loadProducts();
                updateTotals();
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = msg;
            msgDiv.className = `message ${type}`;
            setTimeout(() => {
                msgDiv.innerText = '';
                msgDiv.className = 'message';
            }, 3000);
        }
        
        function closeReceipt() {
            document.getElementById('receiptModal').style.display = 'none';
        }
        
        function printReceipt() {
            const receiptContent = document.getElementById('receiptContent').innerText;
            const printWindow = window.open('', '_blank');
            printWindow.document.write('<pre>' + receiptContent + '</pre>');
            printWindow.document.close();
            printWindow.print();
        }
        
        loadProducts();
        loadCart();
        setInterval(loadCart, 5000);
    </script>
</body>
</html>
