<!DOCTYPE html>
<html>
<head>
    <title>Sales Transaction</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .product { border: 1px solid #ddd; padding: 15px; border-radius: 5px; cursor: pointer; }
        .product:hover { background: #f0f0f0; }
        .cart { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn-success { background: #28a745; }
        .receipt { background: #f8f9fa; padding: 20px; font-family: monospace; margin-top: 20px; white-space: pre-wrap; }
        .back-btn { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="location.href='/'">← Back</button>
        <h1>Sales Transaction</h1>
        <div id="products" class="products"></div>
        <div class="cart">
            <h3>Cart</h3>
            <div id="cart"></div>
            <div>Total: ₱<span id="total">0</span></div>
            <select id="discountType"><option value="none">No Discount</option><option value="percentage">%</option><option value="fixed">Fixed</option></select>
            <input type="number" id="discountValue" placeholder="Discount value">
            <input type="number" id="payment" placeholder="Payment amount">
            <button class="btn-success" onclick="processPayment()">Pay</button>
            <button onclick="clearCart()">Clear</button>
        </div>
        <div id="receipt" class="receipt" style="display:none;"></div>
    </div>
    <script>
        let cart = [];
        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            document.getElementById('products').innerHTML = products.map(p => 
                `<div class="product" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                    <strong>${p.name}</strong><br>₱${p.price}<br>Stock: ${p.stock}
                </div>`
            ).join('');
        }
        function addToCart(id, name, price) {
            const existing = cart.find(i => i.id === id);
            if(existing) existing.quantity++;
            else cart.push({id, name, price, quantity: 1});
            updateCart();
        }
        function updateCart() {
            let total = 0;
            document.getElementById('cart').innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `<div class="cart-item">
                    ${item.name} x${item.quantity} = ₱${item.price * item.quantity}
                    <button onclick="updateQty(${item.id}, -1)">-</button>
                    <button onclick="updateQty(${item.id}, 1)">+</button>
                    <button onclick="removeItem(${item.id})">×</button>
                </div>`;
            }).join('');
            document.getElementById('total').innerText = total;
        }
        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.quantity += delta;
                if(item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                updateCart();
            }
        }
        function removeItem(id) { cart = cart.filter(i => i.id !== id); updateCart(); }
        function clearCart() { cart = []; updateCart(); document.getElementById('receipt').style.display = 'none'; }
        async function processPayment() {
            const payment = parseFloat(document.getElementById('payment').value);
            const discountType = document.getElementById('discountType').value;
            const discountValue = parseFloat(document.getElementById('discountValue').value);
            let discount = null;
            if(discountType !== 'none' && discountValue > 0) discount = {type: discountType, value: discountValue};
            const res = await fetch('/api/process-payment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cart_items: cart, payment, discount})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('receipt').innerHTML = `<pre>${data.receipt}</pre>`;
                document.getElementById('receipt').style.display = 'block';
                cart = [];
                updateCart();
                alert(data.message);
            } else alert('Error: ' + data.message);
        }
        loadProducts();
    </script>
</body>
</html>
