<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Transaction - POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .product-card:hover {
            background: #f0f0f0;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .cart {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .total {
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover { background: #5a67d8; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .receipt {
            background: #f8f9fa;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 20px;
            border-radius: 5px;
            max-height: 500px;
            overflow-y: auto;
        }
        .hidden { display: none; }
        .back-btn {
            background: #6c757d;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Sales Transaction System</h1>
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
        </div>
        
        <h3>Products</h3>
        <div id="productsGrid" class="products-grid"></div>
        
        <div class="cart">
            <h3>Shopping Cart</h3>
            <div id="cartItems"></div>
            <div class="total">Total: ₱<span id="cartTotal">0</span></div>
            <div style="margin-top: 20px;">
                <label>Discount Type:</label>
                <select id="discountType">
                    <option value="none">No Discount</option>
                    <option value="percentage">Percentage (%)</option>
                    <option value="fixed">Fixed Amount (₱)</option>
                </select>
                <input type="number" id="discountValue" placeholder="Discount value" step="0.01">
                <input type="number" id="paymentAmount" placeholder="Payment Amount" step="0.01">
                <button class="btn-success" onclick="processPayment()">Process Payment</button>
                <button onclick="clearCart()">Clear Cart</button>
            </div>
        </div>
        <div id="receipt" class="receipt hidden"></div>
    </div>
    
    <script>
        let currentCart = [];
        
        async function checkAuth() {
            const response = await fetch('/api/check-auth');
            const data = await response.json();
            if (!data.authenticated) {
                window.location.href = '/';
            }
            loadProducts();
        }
        
        async function loadProducts() {
            const response = await fetch('/api/products');
            const products = await response.json();
            document.getElementById('productsGrid').innerHTML = products.map(p => `
                <div class="product-card" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                    <strong>${p.name}</strong><br>
                    ₱${p.price.toFixed(2)}<br>
                    Stock: ${p.stock}
                </div>
            `).join('');
        }
        
        function addToCart(id, name, price) {
            const existing = currentCart.find(item => item.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                currentCart.push({id, name, price, quantity: 1});
            }
            updateCartDisplay();
        }
        
        function updateCartDisplay() {
            const cartDiv = document.getElementById('cartItems');
            let total = 0;
            cartDiv.innerHTML = currentCart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>
                            ₱${item.price} × ${item.quantity} = ₱${(item.price * item.quantity).toFixed(2)}
                            <button onclick="updateQuantity(${item.id}, -1)">-</button>
                            <button onclick="updateQuantity(${item.id}, 1)">+</button>
                            <button class="btn-danger" onclick="removeFromCart(${item.id})">×</button>
                        </span>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').innerText = total.toFixed(2);
        }
        
        function updateQuantity(id, delta) {
            const item = currentCart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    currentCart = currentCart.filter(i => i.id !== id);
                }
                updateCartDisplay();
            }
        }
        
        function removeFromCart(id) {
            currentCart = currentCart.filter(i => i.id !== id);
            updateCartDisplay();
        }
        
        function clearCart() {
            currentCart = [];
            updateCartDisplay();
            document.getElementById('receipt').classList.add('hidden');
        }
        
        async function processPayment() {
            const payment = parseFloat(document.getElementById('paymentAmount').value);
            const discountType = document.getElementById('discountType').value;
            const discountValue = parseFloat(document.getElementById('discountValue').value);
            
            if (!payment || payment <= 0) {
                alert('Please enter payment amount');
                return;
            }
            
            let discount = null;
            if (discountType !== 'none' && discountValue > 0) {
                discount = {type: discountType, value: discountValue};
            }
            
            const response = await fetch('/api/process-payment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    cart_items: currentCart,
                    payment: payment,
                    discount: discount
                })
            });
            
            const data = await response.json();
            if (data.success) {
                document.getElementById('receipt').innerHTML = `<pre>${data.receipt}</pre>`;
                document.getElementById('receipt').classList.remove('hidden');
                currentCart = [];
                updateCartDisplay();
                document.getElementById('paymentAmount').value = '';
                document.getElementById('discountValue').value = '';
                alert(data.message);
            } else {
                alert('Error: ' + data.message);
            }
        }
        
        function goBack() {
            window.location.href = '/';
        }
        
        checkAuth();
    </script>
</body>
</html>
