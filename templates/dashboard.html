<!DOCTYPE html>
<html>
<head>
    <title>POS Dashboard</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .feature { background: white; padding: 20px; border-radius: 10px; text-decoration: none; color: #333; display: block; }
        .feature:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        button { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .login-box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 100px auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="loginBox" class="login-box">
        <h2>POS Login</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="secret">
        <button onclick="login()" style="background: #667eea; width: 100%;">Login</button>
        <p style="margin-top: 10px;">Demo: admin/secret or user/123456</p>
    </div>
    
    <div id="dashboard" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>POS System</h1>
                <span id="userInfo"></span>
                <button onclick="logout()">Logout</button>
            </div>
            <div class="features">
                <a href="/feature1" class="feature"><h3>Sales Transaction</h3><p>Process sales</p></a>
                <a href="/feature2" class="feature"><h3>Receipt Generation</h3><p>View receipts</p></a>
                <a href="/feature3" class="feature"><h3>Sales Reports</h3><p>View analytics</p></a>
                <a href="/products" class="feature"><h3>Products</h3><p>Manage products</p></a>
                <a href="/history" class="feature"><h3>History</h3><p>View transactions</p></a>
            </div>
        </div>
    </div>
    
    <script>
        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username.value, password: password.value})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userInfo').innerHTML = `Welcome ${data.username} (${data.role})`;
            } else alert('Login failed');
        }
        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            location.reload();
        }
        fetch('/api/check-auth').then(r=>r.json()).then(data=>{
            if(data.authenticated) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userInfo').innerHTML = `Welcome ${data.username} (${data.role})`;
            }
        });
    </script>
</body>
</html>
