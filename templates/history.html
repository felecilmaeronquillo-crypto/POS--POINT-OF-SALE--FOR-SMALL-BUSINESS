<!DOCTYPE html>
<html>
<head>
    <title>Transaction History</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 50%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="location.href='/'">← Back</button>
        <h1>Transaction History</h1>
        <div id="transactions"></div>
    </div>
    <div id="modal" class="modal"><div class="modal-content"><span onclick="closeModal()" style="float:right;cursor:pointer;">&times;</span><div id="receipt"></div></div></div>
    <script>
        async function load() {
            const res = await fetch('/api/transactions');
            const t = await res.json();
            document.getElementById('transactions').innerHTML = `
                <table><tr><th>ID</th><th>Date</th><th>Items</th><th>Total</th><th>Cashier</th><th>Action</th></tr>
                ${t.map(tr => `<tr><td>${tr.id}</td><td>${new Date(tr.date).toLocaleString()}</td><td>${tr.items.length}</td><td>₱${tr.total}</td><td>${tr.cashier}</td><td><button onclick="viewReceipt(${tr.id})">View</button></td></tr>`).join('')}
                </table>
            `;
        }
        async function viewReceipt(id) {
            const res = await fetch(`/api/transactions/${id}`);
            const t = await res.json();
            const date = new Date(t.date);
            let html = `<pre>╔════════════════════════════════╗<br>║      MODERN POS SYSTEM       ║<br>╚════════════════════════════════╝<br><br>`;
            html += `Transaction: ${t.id}<br>Date: ${date.toLocaleString()}<br><br>`;
            t.items.forEach(i => { html += `${i.name} x${i.quantity} = ₱${i.price * i.quantity}<br>`; });
            html += `<br>Total: ₱${t.total}<br>Payment: ₱${t.payment}<br>Change: ₱${t.change}<br>════════════════════════════════</pre>`;
            document.getElementById('receipt').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        load();
    </script>
</body>
</html>
